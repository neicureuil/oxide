# crates/teams-media on the three desktop systems: build and device-free loopback tests.
name: Media

on:
  push:
    branches: [main]
    paths: ["crates/teams-media/**", "crates/teams-calling/src/sdp.rs", "Cargo.lock", ".github/workflows/media.yml"]
  pull_request:
    paths: ["crates/teams-media/**", "crates/teams-calling/src/sdp.rs", "Cargo.lock", ".github/workflows/media.yml"]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # libwebrtc's hermetic libc++ needs clang ≥ 21; capture and audio need these headers.
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libx11-dev libxext-dev libxfixes-dev \
            libxdamage-dev libxrandr-dev libxcomposite-dev libxtst-dev libgbm-dev libdrm-dev \
            libpulse-dev libasound2-dev libva-dev libv4l-dev
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 21
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=/usr/lib/llvm-21/lib" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test -p teams-media
