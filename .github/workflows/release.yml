# Cuts a release from main: bumps the version on a release/vX.Y.Z branch, tags it, builds Oxide.app,
# creates a draft GitHub release, points the Homebrew cask at it and merges the branch into main through a pull request.
# Run it by hand from the Actions tab on main, giving the new version (e.g. 0.4.0).
# When the tag exists already (release-gpui.yml ran first), the app is built at that tag, nothing is bumped, and the
# zip is added to the existing release (replaced if there) instead of creating one.
name: Release Swift

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v (e.g. 0.4.0)
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write

# Two releases at once would race on the version.
concurrency: release

jobs:
  release:
    # Apple Silicon runner: the release is arm64 only.
    runs-on: macos-26
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main."
          exit 1

      # Full history: build-app.sh counts commits for the build number, and the changelog needs the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version
        id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          VERSION="${INPUT#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$INPUT' is not X.Y.Z."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/cache@v4
        with:
          path: apps/macos/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('apps/macos/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The version lives in Cargo.toml's [workspace.package]; cargo update rewrites the workspace crates in Cargo.lock.
      - name: Bump the version and tag
        if: steps.version.outputs.created == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          sed -i '' "/^\[workspace.package\]/,/^\[/s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          cargo update --workspace
          git switch -c "release/$TAG"
          git add Cargo.toml Cargo.lock
          git commit -m "Bump version to $VERSION"
          git tag "$TAG"
          git push --atomic origin "release/$TAG" "refs/tags/$TAG"

      # The version as released, with its own Cargo.toml.
      - name: Check out the existing tag
        if: steps.version.outputs.created == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git checkout --detach "refs/tags/$TAG"

      # No SIGN_IDENTITY: the app is signed ad hoc.
      - name: Build Oxide.app
        run: ./scripts/build-app.sh

      - name: Check the signature is ad hoc
        run: codesign -dvv target/Oxide.app 2>&1 | grep -q '^Signature=adhoc$'

      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ditto -c -k --keepParent target/Oxide.app "Oxide-$VERSION.zip"
          echo "sha256=$(shasum -a 256 "Oxide-$VERSION.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # The install notes, then GitHub's changelog since the previous tag (--generate-notes appends it). A release
      # already there (from release-gpui.yml) keeps its notes and gets the zip.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "Oxide-$VERSION.zip" --clobber
            # The GPUI zips uploaded again, so they're listed after this one: versions of the app already installed
            # take a release's first .zip.
            mkdir -p gpui
            gh release download "$TAG" --pattern 'Oxide-gpui-*' --dir gpui || true
            if ls gpui/* >/dev/null 2>&1; then
              gh release upload "$TAG" gpui/* --clobber
            fi
          else
            sed "s/{{VERSION}}/$VERSION/g" .github/release-notes.md > notes.md
            gh release create "$TAG" "Oxide-$VERSION.zip" \
              --title "Oxide $VERSION" --notes-file notes.md --generate-notes --verify-tag --draft
          fi

      # The cask's URL only resolves once the draft is published. For an existing tag, on a branch from main.
      - name: Point the Homebrew cask at the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          TAG: ${{ steps.version.outputs.tag }}
          CREATED: ${{ steps.version.outputs.created }}
        run: |
          BRANCH="release/$TAG"
          if [ "$CREATED" != true ]; then
            BRANCH="release/$TAG-cask"
            git switch -c "$BRANCH" origin/main
          fi
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          sed -i '' \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" \
            Casks/oxide.rb
          git add Casks/oxide.rb
          git commit -m "Point the Homebrew cask at the $VERSION release"
          git push origin "$BRANCH"

      # main only takes pull requests. A merge commit, not a rebase, keeps the tag on main's history.
      - name: Merge into main
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh pr create --base main --head "$BRANCH" \
            --title "Release $VERSION" \
            --body "Points the Homebrew cask at the $VERSION draft release (tagged $TAG), bumping the version if new."
          gh pr merge "$BRANCH" --merge --delete-branch
