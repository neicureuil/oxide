# Builds the GPUI client for Windows on ARM (apps/gpui), to try it out: a zip with oxide-gpui.exe, kept as a
# workflow artifact for two weeks. Runs on each push to feature/gpui that touches the Rust code, or by hand.
# Built on Windows itself: GPUI compiles its DirectX shaders with the Windows SDK's fxc.exe.
name: GPUI Windows ARM64

on:
  push:
    branches: [feature/gpui]
    paths:
      - "apps/gpui/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/gpui-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpui-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-11-arm
    env:
      # The C runtime linked in: nothing to install besides the app (WebView2 comes with Windows 11).
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: gpui-windows-arm64

      # ring and aws-lc build their C with clang on ARM64 Windows; GPUI's build looks for fxc.exe.
      - name: Find clang and fxc
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (Test-Path "$llvm\clang.exe") { Add-Content $env:GITHUB_PATH $llvm }
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $fxc = Get-ChildItem $kits -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue |
            Sort-Object { $_.FullName -notmatch '\\arm64\\' }, { $_.FullName } -Descending:$false |
            Select-Object -First 1
          if (-not $fxc) { Write-Error "fxc.exe not found under $kits"; exit 1 }
          Write-Host "fxc: $($fxc.FullName)"
          Add-Content $env:GITHUB_ENV "GPUI_FXC_PATH=$($fxc.FullName)"
          & "$llvm\clang.exe" --version

      - name: Build
        run: cargo build -p oxide-gpui --release --target aarch64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $out = "dist\Oxide-GPUI-windows-arm64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target\aarch64-pc-windows-msvc\release\oxide-gpui.exe "$out\Oxide.exe"
          Copy-Item apps\gpui\README.md "$out\README.md"

      - uses: actions/upload-artifact@v4
        with:
          name: Oxide-GPUI-windows-arm64
          path: dist/Oxide-GPUI-windows-arm64
          retention-days: 14
